name: Check Friends

on:
  schedule:
    # 每天 02:00 (UTC) 检查一次
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run availability check
        run: node scripts/check-friends.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add friends.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新友链可用性状态"
            git push
            echo "已提交可用性状态更新"
          else
            echo "无变化"
          fi
